name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag against versionName and versionCode
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          code="$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but app/build.gradle.kts says $version"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          expected=$((major * 10000 + minor * 100 + patch))
          if [ "$code" != "$expected" ]; then
            echo "::error::versionCode is ${code:-missing}, $version needs $expected"
            exit 1
          fi

      - name: Release notes from the changelog
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## " version) == 1 { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::No section for ${GITHUB_REF_NAME#v} in CHANGELOG.md"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Check the signature
        env:
          EXPECTED: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          if [ -z "$EXPECTED" ]; then
            echo "::error::The SIGNING_CERT_SHA256 repository variable is missing"
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          actual="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^.*[Ss]igner.* certificate SHA-256 digest: //p' | head -1)"
          expected="$(echo "$EXPECTED" | tr -d ': ' | tr 'A-F' 'a-f')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Signed with $actual, expected $expected"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fixed name keeps releases/latest/download/pebble-phone-connect.apk pointing at the newest.
          cp app/build/outputs/apk/release/app-release.apk pebble-phone-connect.apk
          sha256sum pebble-phone-connect.apk > pebble-phone-connect.apk.sha256
          gh release create "$GITHUB_REF_NAME" pebble-phone-connect.apk pebble-phone-connect.apk.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
